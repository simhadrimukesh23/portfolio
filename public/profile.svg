<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="400" height="450" fill="url(#bgGrad)" rx="24" />
  
  <!-- Subtle circular grid -->
  <circle cx="200" cy="180" r="120" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="200" cy="180" r="95" fill="#1e1b4b" stroke="#312e81" stroke-width="2" />
  
  <!-- Stylized Avatar / Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="155" r="42" fill="#4338ca" />
  <circle cx="200" cy="150" r="38" fill="#6366f1" />
  
  <!-- Shoulders / Torso -->
  <path d="M125 250 C125 205, 275 205, 275 250 L275 270 L125 270 Z" fill="#4f46e5" />
  <path d="M140 250 C140 215, 260 215, 260 250 L260 270 L140 270 Z" fill="#6366f1" opacity="0.8" />
  
  <!-- Initials Badge -->
  <rect x="160" y="295" width="80" height="32" rx="16" fill="url(#glowGrad)" />
  <text x="200" y="316" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SM</text>
  
  <!-- Upload instructions text -->
  <text x="200" y="365" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">Upload Your Photo</text>
  <text x="200" y="390" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">public/profile.png</text>
</svg>
